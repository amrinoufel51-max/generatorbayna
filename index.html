<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>JSON Generator للولايات</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 10px; border: none; width: 100%; cursor: pointer; border-radius: 4px; }
        textarea { width: 100%; height: 200px; margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <h2>مولد بيانات JSON</h2>
    <input type="number" id="id" placeholder="رقم الولاية (ID)">
    <input type="text" id="name" placeholder="الاسم بالفرنسية (ex: Alger)">
    <input type="text" id="name_ar" placeholder="الاسم بالعربية (ex: الجزائر)">
    <button onclick="generateJSON()">توليد كود JSON</button>
    <textarea id="output" readonly placeholder="سيظهر الكود هنا..."></textarea>
</div>

<script>
    function generateJSON() {
        const data = {
            id: parseInt(document.getElementById('id').value),
            name: document.getElementById('name').value,
            name_ar: document.getElementById('name_ar').value
        };
        document.getElementById('output').value = JSON.stringify(data, null, 4);
    }
</script>

</body>
</html>
